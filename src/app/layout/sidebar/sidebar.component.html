<aside
  class="h-screen bg-white border-right-1 sidebar-custom-border flex flex-column transition-all transition-duration-300 flex-shrink-0 sticky top-0"
  [ngClass]="isOpen ? 'w-16rem' : 'w-5rem'">

  <!-- Logo Area -->
  <div 
    class="h-4rem flex align-items-center border-bottom-1 sidebar-custom-border px-3"
    [ngClass]="isOpen ? 'justify-content-between' : 'justify-content-center'">
    
    <!-- Logo + Tên Web -->
    <div *ngIf="isOpen" class="flex align-items-center overflow-hidden">
      <img src="../../../assets/1.png" alt="Logo" class="w-2rem h-2rem object-contain flex-shrink-0" />
      <span class="ml-3 font-semibold text-lg text-primary-dark white-space-nowrap overflow-hidden text-overflow-ellipsis font-headline">
        Future English
      </span>
    </div>

    <!-- Nút Toggle đóng mở Sidebar -->
    <button
      type="button"
      (click)="handleToggleSidebar()"
      class="toggle-btn border-none bg-transparent hover:surface-hover p-2 border-round-lg cursor-pointer flex align-items-center justify-content-center transition-colors">
      <i class="pi pi-bars text-xl"></i>
    </button>

  </div>

  <!-- Main Menu -->
  <nav class="flex-1 py-4 px-3 flex flex-column gap-2 overflow-y-auto overflow-x-hidden">
    <a *ngFor="let item of menuItems"
       [routerLink]="item.path"
       routerLinkActive="active-menu-item"
       [routerLinkActiveOptions]="{ exact: item.path === '/' }"
       class="nav-btn flex align-items-center px-3 py-3 border-round-xl no-underline text-secondary-custom transition-all cursor-pointer font-body"
       [ngClass]="{ 'justify-content-center': !isOpen }">
      <div class="flex-shrink-0 flex align-items-center justify-content-center w-2rem">
        <i [class]="item.icon + ' text-xl'"></i>
      </div>
      <span *ngIf="isOpen" class="ml-3 font-medium white-space-nowrap text-base">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Bottom Menu -->
  <div class="p-3 border-top-1 sidebar-custom-border flex flex-column gap-2">
    
    <!-- Logout Button (Dùng class PrimeFlex: text-red-500, surface-0/hover:bg-red-50) -->
    <button
      type="button"
      (click)="logout()"
      class="logout-btn w-full flex align-items-center px-3 py-3 border-round-xl text-red-500 hover:bg-red-50 transition-all border-none bg-transparent cursor-pointer font-body"
      [ngClass]="{ 'justify-content-center': !isOpen }">
      <div class="flex-shrink-0 flex align-items-center justify-content-center w-2rem">
        <i class="pi pi-sign-out text-xl text-red-500"></i>
      </div>
      <span *ngIf="isOpen" class="ml-3 font-semibold white-space-nowrap text-base text-red-500">Log out</span>
    </button>

  </div>

</aside>
